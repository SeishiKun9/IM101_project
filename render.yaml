services:
  - type: web
    name: im101-project-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: im101-project-db
          property: connectionString
      - key: ADMIN_SETUP_TOKEN
        sync: false

databases:
  - name: im101-project-db
    databaseName: im101_project
    user: im101_project
    region: singapore
    plan: free
