services:
  - type: web
    name: campus-lost-found
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node db/migrate.js && node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-lost-found-db
          property: connectionString
      - key: ADMIN_SETUP_TOKEN
        generateValue: true

databases:
  - name: campus-lost-found-db
    databaseName: campus_lost_found
    user: campus_user
    plan: free
