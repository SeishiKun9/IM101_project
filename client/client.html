<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client Workspace | Campus Lost &amp; Found</title>
    <link rel="stylesheet" href="/assets/css/portal.css" />
  </head>
  <body data-role="student">
    <header>
      <a class="brand" href="/">
        <span>LF</span>
        Campus Lost &amp; Found</a
      >
      <nav>
        <a href="/">Public board</a>
        <a class="active" href="/client.html">My workspace</a>
        <button data-signout>Sign out</button>
      </nav>
    </header>
    <main>
      <p class="eyebrow">STUDENT / CLIENT PORTAL</p>
      <h1>Your lost-and-found workspace</h1>
      <p class="intro">
        Report an item, follow verification, and request found items that may
        belong to you.
      </p>
      <div class="actions">
        <a class="primary" href="/?openReport=1#report">＋ Report an item</a>
        <a class="secondary" href="/#browse">Browse found items</a>
      </div>
      <section class="stats" id="stats"></section>
      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">YOUR ACTIVITY</p>
            <h2>Submitted reports</h2>
          </div>
          <span id="record-count"></span>
        </div>
        <div id="records" class="records"></div>
      </section>
    </main>
    <script src="/assets/js/portal.js"></script>
  </body>
</html>
